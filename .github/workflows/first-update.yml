name: First update checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: first-update-${{ github.ref }}
  cancel-in-progress: true
jobs:
  java:
    name: Java tests and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: sh mvnw --batch-mode --no-transfer-progress verify
  node:
    name: Gateway tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: node-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: node-api/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
  browser:
    name: Isolated calculator browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: node-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: node-api/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps chromium
      - run: npx --no-install playwright test simulator.spec.js
  portal:
    name: PostgreSQL portal integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: node-api/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16
      - run: npm ci --no-audit --no-fund
        working-directory: node-api
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: node-api
      - run: sh mvnw --batch-mode --no-transfer-progress package -DskipTests
      - name: Configure private PostgreSQL socket directory
        run: |
          mkdir -p .local/pg-bin
          ln -s /usr/lib/postgresql/16/bin/postgres .local/pg-bin/postgres
          ln -s /usr/lib/postgresql/16/bin/pg_ctl .local/pg-bin/pg_ctl
          cat > .local/pg-bin/initdb <<'SH'
          #!/bin/sh
          /usr/lib/postgresql/16/bin/initdb "$@" || exit $?
          printf "\\nunix_socket_directories = '%s'\\n" "$PWD/.local" >> .local/postgres/postgresql.conf
          SH
          chmod +x .local/pg-bin/initdb
      - name: Start isolated local stack with generated test credentials
        run: node scripts/local.mjs start
        env:
          POSTGRES_BIN: .local/pg-bin
          LOCAL_DATABASE_PORT: '55432'
          ADMIN_EMAIL: admin@test.invalid
          ADMIN_NAME: admin
      - run: npx --no-install playwright test portal.spec.js
        working-directory: node-api
      - name: Stop isolated stack
        if: always()
        run: node scripts/local.mjs stop
        env:
          POSTGRES_BIN: .local/pg-bin
