spring.application.name=nyt-loan-service
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.shutdown=graceful
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=${DATABASE_FETCH_BATCH_SIZE:50}
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:6MB}
spring.mvc.problemdetails.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
spring.profiles.default=oidc
app.security.roles-claim=${OIDC_ROLES_CLAIM:roles}
app.crypto.active-key-id=${ENCRYPTION_ACTIVE_KEY_ID}
app.crypto.keys=${ENCRYPTION_KEYS}
app.documents.max-bytes=${DOCUMENT_MAX_BYTES:5242880}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
